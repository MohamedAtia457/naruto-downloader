name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev lld
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Accept Android Licenses & Build
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android debug || (yes | buildozer -v android debug)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Naruto-Downloader-APK
          path: bin/*.apk
          
