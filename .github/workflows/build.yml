name: Build Android APK

on:
push:
branches: ["main", "master"]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Install System Dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip autoconf libtool pkg-config \
        zlib1g-dev libncurses5-dev libncursesw5-dev \
        libtinfo5 cmake libffi-dev libssl-dev lld \
        build-essential ccache
      python -m pip install --upgrade pip
      pip install buildozer cython==0.29.33

  - name: Prepare Android SDK Licenses
    run: |
      mkdir -p "$HOME/.android"
      touch "$HOME/.android/repositories.cfg"
      SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
      if [ -z "$SDKMANAGER" ]; then
        echo "sdkmanager not found in Android SDK"
        exit 1
      fi
      yes | "$SDKMANAGER" --licenses || true

  - name: Build with Buildozer
    env:
      ANDROID_ACCEPT_SDK_LICENSE: "1"
    run: |
      buildozer -v android debug

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Naruto-Downloader-APK
      path: bin/*.apk
      if-no-files-found: error
